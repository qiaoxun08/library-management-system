# Server Configuration
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/library_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
# 本地开发默认值；生产环境必须通过 DB_PASSWORD 环境变量注入（docker-compose 已强制）
spring.datasource.password=${DB_PASSWORD:745820}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.library.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Redis Configuration
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.database=0

# JWT Configuration
# 必须通过 JWT_SECRET 环境变量提供（≥32字节随机串），无弱默认值——缺失时启动即失败
# 生成方式：openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Jackson Configuration
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Shanghai

# Logging Configuration
logging.level.com.library=INFO
logging.level.org.springframework.security=INFO

# Library Business Configuration
library.borrowing.default-days=30
library.borrowing.renew-days=30
library.borrowing.max-renew-count=2
library.fine.daily-rate=0.10
